.flow-note{margin-top:32px;padding:16px 18px;border-radius:16px;border:1px solid var(--nline);background:var(--night-2);display:flex;gap:12px;align-items:center;color:var(--mist)}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,19,34,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}

.media{background:#0A1322;padding:16px;display:grid;gap:10px;align-content:start}

function spy(){$('#hdr').classList.toggle('s',scrollY>8);let on='';NAV.forEach(([id])=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<innerHeight*.35)on=id});$$('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+on))}
addEventListener('scroll',spy,{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
statics(); spy(); $$('.rv').forEach(el=>io.observe(el));
})();
</script>
